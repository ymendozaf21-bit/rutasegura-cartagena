<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionar reporte - RutaSegura Cartagena</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="navbar" data-base="../" data-activa="admin"></div>
  <main>
    <div class="container">
      <p><a href="admin.html">&larr; Volver al panel</a></p>
      <div id="aviso"></div>
      <div id="contenido"></div>
    </div>
  </main>
  <div id="footer"></div>

  <script src="../js/validaciones.js"></script>
  <script src="../js/reportes.js"></script>
  <script src="../js/main.js"></script>
  <script>
    const sesion = obtenerSesion();
    const cont = document.getElementById('contenido');
    const id = Number(new URLSearchParams(window.location.search).get('id'));

    function pintar() {
      const reportes = obtenerReportes();
      const r = reportes.find(function (x) { return x.id === id; });
      if (!r) {
        cont.innerHTML = '<div class="alerta error" style="display:block">No se encontró el reporte.</div>';
        return;
      }

      const foto = r.foto ? '<div class="fotos"><img src="' + r.foto + '" alt="Foto del reporte"></div>' : '';
      const hist = r.historial.map(function (h) {
        return '<li><strong>' + capitalizar(h.estado) + '</strong> · ' + formatoFecha(h.fecha) + '</li>';
      }).join('');
      const opciones = ['pendiente', 'verificado', 'resuelto'].map(function (e) {
        return '<option value="' + e + '"' + (e === r.estado ? ' selected' : '') + '>' + capitalizar(e) + '</option>';
      }).join('');

      cont.innerHTML =
        '<div class="detalle">' +
        '<h1>Reporte #' + r.id + ': ' + escapeHtml(r.ubicacion) + '</h1>' + foto +
        '<dl>' +
        '<dt>Nivel</dt><dd><span class="badge ' + r.nivel + '">' + capitalizar(r.nivel) + '</span></dd>' +
        '<dt>Estado actual</dt><dd><span class="badge ' + r.estado + '">' + capitalizar(r.estado) + '</span></dd>' +
        '<dt>Fecha</dt><dd>' + formatoFecha(r.fecha) + '</dd>' +
        '<dt>Reportado por</dt><dd>' + escapeHtml(r.autorNombre) + '</dd>' +
        '<dt>Descripción</dt><dd>' + escapeHtml(r.descripcion) + '</dd>' +
        '</dl>' +
        '<h2 style="margin-top:1.25rem">Historial de estados</h2>' +
        '<ul class="historial">' + hist + '</ul>' +
        '<form id="formEstado" style="margin-top:1.25rem">' +
        '<div id="alerta" class="alerta"></div>' +
        '<div class="form-group"><label for="nuevoEstado">Cambiar estado</label>' +
        '<select id="nuevoEstado">' + opciones + '</select></div>' +
        '<button type="submit" class="btn btn-primario">Guardar estado</button> ' +
        '<button type="button" class="btn btn-peligro" id="btnEliminar">Eliminar reporte</button>' +
        '</form></div>';

      document.getElementById('formEstado').addEventListener('submit', function (e) {
        e.preventDefault();
        const nuevo = document.getElementById('nuevoEstado').value;
        if (nuevo === r.estado) {
          mostrarAlerta('alerta', 'error', 'El reporte ya está en ese estado.');
          return;
        }
        r.estado = nuevo;
        r.historial.push({ estado: nuevo, fecha: new Date().toISOString() });
        guardarReportes(reportes);
        pintar();
        mostrarAlerta('alerta', 'exito', 'Estado actualizado a ' + capitalizar(nuevo) + '.');
      });

      document.getElementById('btnEliminar').addEventListener('click', function () {
        if (confirm('¿Eliminar este reporte? Esta acción no se puede deshacer.')) {
          guardarReportes(reportes.filter(function (x) { return x.id !== id; }));
          window.location.href = 'admin.html';
        }
      });
    }

    if (!sesion || sesion.rol !== 'admin') {
      document.getElementById('aviso').innerHTML =
        '<div class="alerta error" style="display:block">Solo el administrador puede gestionar reportes. <a href="login.html">Ingresar</a></div>';
    } else {
      pintar();
    }
  </script>
</body>
</html>
